<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title> Sangre Cruceña </title>
    <!-- Fuente premium Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <div id="game-container">
        <!-- Lienzo del juego (Canvas) -->
        <canvas id="game-canvas"></canvas>

        <!-- Capa de interfaz de usuario (SVG / HTML sobrepuesto) -->
        <div id="ui-container">
            <!-- Aquí irá el HUD de recursos, botones de mando y cartas de reclutamiento -->
        </div>

        <!-- Overlay de orientación para dispositivos móviles -->
        <div id="overlay-orientacion" style="display: none;">
            <div class="contenido-overlay">
                <div class="icono-rotar">
                    <svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
                        <path d="M12 18h.01" />
                        <path d="M19 12a7 7 0 0 1-7 7v-3l-4 4 4 4v-3a9 9 0 0 0 9-9z" />
                    </svg>
                </div>
                <p class="texto-orientacion">Gira tu dispositivo. Este juego requiere orientación horizontal.</p>
            </div>
        </div>
    </div>

    <!-- Script de orientación para móviles -->
    <script src="js/orientacion.js"></script>
    <!-- Script de entrada principal -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
