<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pico en Canvas</title>

<style>
body{
    margin:0;
    background:#d9d9d9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    background:white;
    border:1px solid #444;
}
</style>

</head>
<body>

<canvas id="canvas" width="900" height="700"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "black";


//====================
// MANGO
//====================

ctx.beginPath();

ctx.moveTo(170,560);
ctx.lineTo(205,595);
ctx.lineTo(565,235);
ctx.lineTo(530,200);

ctx.closePath();
ctx.fill();


//====================
// CABEZA DEL PICO
//====================

ctx.beginPath();

ctx.moveTo(505,170);
ctx.lineTo(555,120);
ctx.lineTo(640,205);
ctx.lineTo(590,255);
ctx.closePath();

ctx.fill();


//====================
// HOJA SUPERIOR
//====================

ctx.beginPath();

ctx.moveTo(555,120);

// borde superior
ctx.bezierCurveTo(
    475,70,
    355,-20,
    145,35
);

// borde inferior
ctx.bezierCurveTo(
    260,40,
    460,130,
    520,180
);

ctx.closePath();
ctx.fill();


//====================
// HOJA INFERIOR
//====================

ctx.beginPath();

ctx.moveTo(630,200);

// borde exterior
ctx.bezierCurveTo(
    800,380,
    810,460,
    760,610
);

// borde interior
ctx.bezierCurveTo(
    780,570,
    700,350,
    590,255
);

ctx.closePath();
ctx.fill();

</script>

</body>
</html>
