<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Boton de Pausa - HTML5 Canvas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000000;
        }

        canvas {
            background-color: #000000;
        }
    </style>
</head>

<body>

    <canvas id="miCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('miCanvas');
        const ctx = canvas.getContext('2d');

        // Fondo negro del lienzo
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // --- 1. CIRCULO EXTERIOR (ANILLO BLANCO) ---
        ctx.beginPath();
        ctx.arc(250, 250, 210, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // --- 2. CIRCULO INTERIOR CON DEGRADADO (NARANJA Y AMARILLO) ---
        const gradient = ctx.createRadialGradient(230, 200, 20, 250, 250, 200);
        gradient.addColorStop(0, '#fdbb2d'); // Amarillo brillante (luz superior)
        gradient.addColorStop(1, '#f39c12'); // Naranja cálido (base)

        ctx.beginPath();
        ctx.arc(250, 250, 200, 0, 2 * Math.PI);
        ctx.fillStyle = gradient;
        ctx.fill();

        // --- 3. BARRA DE PAUSA IZQUIERDA (BLANCA) ---
        ctx.beginPath();
        ctx.moveTo(178, 170); // Esquina superior izquierda
        ctx.lineTo(238, 170); // Esquina superior derecha
        ctx.lineTo(238, 330); // Esquina inferior derecha
        ctx.lineTo(178, 330); // Esquina inferior izquierda
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // --- 4. BARRA DE PAUSA DERECHA (BLANCA) ---
        ctx.beginPath();
        ctx.moveTo(262, 170); // Esquina superior izquierda
        ctx.lineTo(322, 170); // Esquina superior derecha
        ctx.lineTo(322, 330); // Esquina inferior derecha
        ctx.lineTo(262, 330); // Esquina inferior izquierda
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();

    </script>

</body>

</html>
