<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo de Juego - Paisaje con Montañas Lejanas</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        #gameContainer:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        .ui-info {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        // Configuración de dimensiones del mundo y cámara
        const WORLD_WIDTH = 3000;
        let cameraX = 0;

        // Variables de interacción para el arrastre
        let isDragging = false;
        let startX = 0;
        let startCameraX = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            clampCamera();
            render();
        }

        function clampCamera() {
            const maxScroll = WORLD_WIDTH - canvas.width;
            if (maxScroll < 0) {
                cameraX = 0;
            } else {
                if (cameraX < 0) cameraX = 0;
                if (cameraX > maxScroll) cameraX = maxScroll;
            }
        }

        // ==========================================
        // RENDERIZADO DEL PAISAJE
        // ==========================================
        function render() {
            const width = canvas.width;
            const height = canvas.height;

            // ------------------------------------------
            // GRUPO 1: CIELO DE DÍA
            // ------------------------------------------
            const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
            skyGrad.addColorStop(0, '#3a88e9');   // Azul intenso superior
            skyGrad.addColorStop(0.55, '#87ceeb'); // Azul claro horizonte
            skyGrad.addColorStop(1, '#cbe8f6');    // Tono suave bajo
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, height);

            // ------------------------------------------
            // GRUPO 2: SOL ELEVADO
            // ------------------------------------------
            // Posición ajustada para estar más alto en el cielo (height * 0.28)
            const sunWorldX = 1100 - (cameraX * 0.4);
            const sunY = height * 0.28;
            const sunRadius = 110;

            // Resplandor exterior del Sol
            ctx.beginPath();
            ctx.arc(sunWorldX, sunY, sunRadius + 25, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 180, 0.35)';
            ctx.fill();

            // Sol Amarillo central
            ctx.beginPath();
            ctx.arc(sunWorldX, sunY, sunRadius, 0, Math.PI * 2);
            const sunGrad = ctx.createRadialGradient(sunWorldX, sunY, 10, sunWorldX, sunY, sunRadius);
            sunGrad.addColorStop(0, '#ffffff');
            sunGrad.addColorStop(0.3, '#ffeb3b');
            sunGrad.addColorStop(1, '#fbc02d');
            ctx.fillStyle = sunGrad;
            ctx.fill();

            // ------------------------------------------
            // GRUPO 3: NUBES FLOTANTES
            // ------------------------------------------
            drawCloud(400 - cameraX * 0.3, height * 0.18, 90);
            drawCloud(1200 - cameraX * 0.3, height * 0.12, 120);
            drawCloud(2200 - cameraX * 0.3, height * 0.15, 100);

            // ------------------------------------------
            // GRUPO 4: MONTAÑAS LEJANAS (ALTAS Y DISTANTES)
            // ------------------------------------------
            // Fondo de cordilleras con velocidad parallax muy lenta (0.15)
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.45);
            ctx.lineTo(300 - cameraX * 0.15, height * 0.32);
            ctx.lineTo(650 - cameraX * 0.15, height * 0.42);
            ctx.lineTo(1000 - cameraX * 0.15, height * 0.28);
            ctx.lineTo(1400 - cameraX * 0.15, height * 0.40);
            ctx.lineTo(1850 - cameraX * 0.15, height * 0.25);
            ctx.lineTo(2300 - cameraX * 0.15, height * 0.38);
            ctx.lineTo(2750 - cameraX * 0.15, height * 0.29);
            ctx.lineTo(3200 - cameraX * 0.15, height * 0.45);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = '#0F4D18'; // Azul/Grisáceo de distancia atmosférica
            ctx.fill();

            // Segunda capa de picos de montaña más cercanos
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.50);
            ctx.lineTo(200 - cameraX * 0.2, height * 0.38);
            ctx.lineTo(500 - cameraX * 0.2, height * 0.48);
            ctx.lineTo(850 - cameraX * 0.2, height * 0.35);
            ctx.lineTo(1250 - cameraX * 0.2, height * 0.46);
            ctx.lineTo(1600 - cameraX * 0.2, height * 0.33);
            ctx.lineTo(2050 - cameraX * 0.2, height * 0.47);
            ctx.lineTo(2500 - cameraX * 0.2, height * 0.36);
            ctx.lineTo(3000 - cameraX * 0.2, height * 0.48);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = '#155C1F'; // Tono un poco más oscuro
            ctx.fill();

            // ------------------------------------------
            // GRUPO 5: COLINA TRASERA (VERDE OSCURO)
            // ------------------------------------------
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.52);
            ctx.quadraticCurveTo(600 - cameraX, height * 0.48, 1200 - cameraX, height * 0.53);
            ctx.quadraticCurveTo(1800 - cameraX, height * 0.58, 2400 - cameraX, height * 0.50);
            ctx.quadraticCurveTo(2800 - cameraX, height * 0.46, 3200 - cameraX, height * 0.54);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = '#1b5e20';
            ctx.fill();

            // Hierba alta de la colina trasera
            drawGrassDetails(150 - cameraX, height * 0.51, '#2e7d32');
            drawGrassDetails(750 - cameraX, height * 0.50, '#2e7d32');
            drawGrassDetails(1450 - cameraX, height * 0.55, '#2e7d32');
            drawGrassDetails(2150 - cameraX, height * 0.51, '#2e7d32');

            // ------------------------------------------
            // GRUPO 6: COLINA FRONTAL PRINCIPAL
            // ------------------------------------------
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.58);
            ctx.quadraticCurveTo(500 - cameraX, height * 0.65, 1000 - cameraX, height * 0.58);
            ctx.quadraticCurveTo(1600 - cameraX, height * 0.50, 2200 - cameraX, height * 0.62);
            ctx.quadraticCurveTo(2700 - cameraX, height * 0.70, 3200 - cameraX, height * 0.56);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = '#388e3c';
            ctx.fill();

            // Capa de pradera de primer plano
            ctx.beginPath();
            ctx.moveTo(0, height);
            ctx.lineTo(0, height * 0.62);
            ctx.quadraticCurveTo(600 - cameraX, height * 0.72, 1300 - cameraX, height * 0.61);
            ctx.quadraticCurveTo(2000 - cameraX, height * 0.53, 3200 - cameraX, height * 0.66);
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fillStyle = '#4caf50';
            ctx.fill();

            // Cúmulos de pasto en primer plano
            drawGrassCluster(100 - cameraX, height * 0.62);
            drawGrassCluster(450 - cameraX, height * 0.67);
            drawGrassCluster(850 - cameraX, height * 0.61);
            drawGrassCluster(1350 - cameraX, height * 0.58);
            drawGrassCluster(1900 - cameraX, height * 0.55);
            drawGrassCluster(2400 - cameraX, height * 0.64);
            drawGrassCluster(2850 - cameraX, height * 0.60);

            // ------------------------------------------
            // GRUPO 7: ENEMIGO AL FINAL DEL MAPA (2700px)
            // ------------------------------------------
            drawEnemy(2700 - cameraX, height * 0.62);
        }

        // ------------------------------------------
        // FUNCIONES AUXILIARES DE DIBUJO
        // ------------------------------------------

        // Dibuja nubes compuestas por arcos
        function drawCloud(x, y, scale) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.arc(x, y, scale * 0.3, 0, Math.PI * 2);
            ctx.arc(x + scale * 0.25, y - scale * 0.1, scale * 0.25, 0, Math.PI * 2);
            ctx.arc(x + scale * 0.5, y, scale * 0.28, 0, Math.PI * 2);
            ctx.arc(x + scale * 0.25, y + scale * 0.08, scale * 0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Dibuja brotes simples de hierba
        function drawGrassDetails(x, y, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 8, y - 18);
            ctx.lineTo(x + 2, y);
            ctx.lineTo(x + 8, y - 24);
            ctx.lineTo(x + 10, y);
            ctx.lineTo(x + 18, y - 15);
            ctx.lineTo(x + 16, y);
            ctx.fill();
        }

        // Dibuja mechones curvados de pasto
        function drawGrassCluster(x, y) {
            ctx.fillStyle = '#2e7d32';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.quadraticCurveTo(x - 15, y - 30, x - 25, y - 35);
            ctx.quadraticCurveTo(x - 10, y - 15, x - 5, y);
            ctx.quadraticCurveTo(x, y - 40, x + 2, y - 45);
            ctx.quadraticCurveTo(x + 8, y - 20, x + 10, y);
            ctx.quadraticCurveTo(x + 25, y - 35, x + 35, y - 30);
            ctx.quadraticCurveTo(x + 18, y - 10, x + 15, y);
            ctx.fill();
        }

        // ------------------------------------------
        // CONTROLES DE DESLIZAMIENTO (TOUCH / MOUSE)
        // ------------------------------------------
        function onPointerDown(x) {
            isDragging = true;
            startX = x;
            startCameraX = cameraX;
        }

        function onPointerMove(x) {
            if (!isDragging) return;
            const dx = startX - x;
            cameraX = startCameraX + dx;
            clampCamera();
            render();
        }

        function onPointerUp() {
            isDragging = false;
        }

        // Eventos de Mouse
        container.addEventListener('mousedown', (e) => onPointerDown(e.clientX));
        window.addEventListener('mousemove', (e) => onPointerMove(e.clientX));
        window.addEventListener('mouseup', onPointerUp);

        // Eventos Táctiles
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) onPointerDown(e.touches[0].clientX);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) onPointerMove(e.touches[0].clientX);
        });
        window.addEventListener('touchend', onPointerUp);

        // Redimensionamiento
        window.addEventListener('resize', resize);
        resize();
    </script>

</body>

</html>
