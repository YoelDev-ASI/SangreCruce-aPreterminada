<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Moneda de Oro - HTML5 Canvas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #ffffff;
        }

        canvas {
            background-color: #ffffff;
        }
    </style>
</head>

<body>

    <canvas id="miCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('miCanvas');
        const ctx = canvas.getContext('2d');

        const cx = 250;
        const cy = 250;

        // --- 1. BORDE EXTERIOR FINO (DORADO OSCURO) ---
        ctx.beginPath();
        ctx.arc(cx, cy, 210, 0, 2 * Math.PI);
        ctx.fillStyle = '#b87c12';
        ctx.fill();

        // --- 2. ANILLO EXTERIOR CON DEGRADADO DIAGONAL ---
        const gradAnilloExt = ctx.createLinearGradient(100, 100, 400, 400);
        gradAnilloExt.addColorStop(0, '#ffe875');   // Dorado brillante (superior izq)
        gradAnilloExt.addColorStop(0.3, '#f2a912'); // Dorado medio
        gradAnilloExt.addColorStop(0.7, '#d18608'); // Dorado oscuro
        gradAnilloExt.addColorStop(1, '#fff4a8');   // Reflejo claro (inferior der)

        ctx.beginPath();
        ctx.arc(cx, cy, 208, 0, 2 * Math.PI);
        ctx.fillStyle = gradAnilloExt;
        ctx.fill();

        // --- 3. BORDES Y SOMBRAS DEL ANILLO INTERMEDIO ---
        ctx.beginPath();
        ctx.arc(cx, cy, 185, 0, 2 * Math.PI);
        ctx.strokeStyle = '#8a5907';
        ctx.lineWidth = 3;
        ctx.stroke();

        const gradAnilloInt = ctx.createLinearGradient(120, 120, 380, 380);
        gradAnilloInt.addColorStop(0, '#fabb1e');
        gradAnilloInt.addColorStop(0.5, '#e09307');
        gradAnilloInt.addColorStop(1, '#ffe07d');

        ctx.beginPath();
        ctx.arc(cx, cy, 183, 0, 2 * Math.PI);
        ctx.fillStyle = gradAnilloInt;
        ctx.fill();

        // --- 4. RELIEVE / SOMBRA DEL CÍRCULO CENTRAL ---
        ctx.beginPath();
        ctx.arc(cx, cy, 131, 0, 2 * Math.PI);
        ctx.fillStyle = '#6e4402';
        ctx.fill();

        // --- 5. CÍRCULO CENTRAL (DISCO ELEVADO CON LUZ DIAGONAL) ---
        const gradCentro = ctx.createLinearGradient(150, 150, 350, 350);
        gradCentro.addColorStop(0, '#ffeb7a');   // Brillo superior izquierdo
        gradCentro.addColorStop(0.4, '#f5af16'); // Dorado medio
        gradCentro.addColorStop(1, '#b87400');   // Sombra inferior derecha

        ctx.beginPath();
        ctx.arc(cx, cy, 129, 0, 2 * Math.PI);
        ctx.fillStyle = gradCentro;
        ctx.fill();

    </script>

</body>

</html>
