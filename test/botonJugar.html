<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Botón JUGAR</title>
<style>
    body{
        background:#4d5aa8;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    canvas{
        border:1px solid black;
        background:#4d5aa8;
    }
</style>
</head>
<body>

<canvas id="canvas" width="320" height="180"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

dibujarBotonJugar(50,40);

function dibujarBotonJugar(x,y){

    dibujarSombra(x,y);

    dibujarFondo(x,y);

    dibujarBrillos(x,y);

    dibujarTexto(x,y);

}

function dibujarSombra(x,y){

    ctx.beginPath();

    ctx.roundRect(x+5,y+5,220,80,15);

    ctx.fillStyle="rgba(0,0,0,0.35)";

    ctx.fill();

}

function dibujarFondo(x,y){

    let gradiente = ctx.createLinearGradient(0,y,0,y+80);

    gradiente.addColorStop(0,"#ff6a6a");
    gradiente.addColorStop(0.45,"#ff3c3c");
    gradiente.addColorStop(1,"#b00000");

    ctx.beginPath();

    ctx.roundRect(x,y,220,80,15);

    ctx.fillStyle=gradiente;

    ctx.fill();

    ctx.lineWidth=4;

    ctx.strokeStyle="#4b0000";

    ctx.stroke();

}

function dibujarBrillos(x,y){

    ctx.strokeStyle="white";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(x+20,y+12);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(x+150,y+12);

    ctx.stroke();


    ctx.strokeStyle="rgba(255,255,255,0.5)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(x+8,y+20);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(x+212,y+20);

    ctx.stroke();

}

function dibujarTexto(x,y){

    ctx.font="bold 42px Arial";

    ctx.fillStyle="black";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText("JUGAR",x+110,y+42);

}

</script>

</body>
</html>
