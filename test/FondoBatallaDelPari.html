<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pueblo Colonial Panorámico (3000px) - Canvas JS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        #gameContainer:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
        }

        .ui-info {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>

<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('gameContainer');

        // Dimensiones internas del escenario panorámico
        const WORLD_WIDTH = 3000;
        const WORLD_HEIGHT = 800;
        let cameraX = 0;

        // Variables de interacción por arrastre (Mouse / Touch)
        let isDragging = false;
        let startX = 0;
        let startCameraX = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            clampCamera();
            render();
        }

        function clampCamera() {
            const maxScroll = WORLD_WIDTH - canvas.width;
            if (maxScroll < 0) {
                cameraX = 0;
            } else {
                if (cameraX < 0) cameraX = 0;
                if (cameraX > maxScroll) cameraX = maxScroll;
            }
        }

        // ==========================================
        // RENDERIZADO DEL ESCENARIO PANORÁMICO
        // ==========================================
        function render() {
            const viewH = canvas.height;
            const scale = viewH / WORLD_HEIGHT;

            ctx.save();
            ctx.scale(scale, scale);
            ctx.translate(-cameraX, 0);

            // ------------------------------------------
            // GRUPO 1: CIELO AZUL DIURNO Y NUBES
            // ------------------------------------------
            const skyGrad = ctx.createLinearGradient(0, 0, 0, 450);
            skyGrad.addColorStop(0, '#2b80d9');   // Azul vívido superior
            skyGrad.addColorStop(0.6, '#6eb0f2'); // Azul claro
            skyGrad.addColorStop(1, '#bde0fe');   // Iluminación bajo el horizonte
            ctx.fillStyle = skyGrad;
            ctx.fillRect(cameraX, 0, canvas.width / scale, WORLD_HEIGHT);

            // Nubes esponjosas dispersas
            drawCloud(250, 90, 1.2);
            drawCloud(750, 130, 0.9);
            drawCloud(1300, 80, 1.4);
            drawCloud(1850, 110, 1.1);
            drawCloud(2450, 95, 1.3);

            // ------------------------------------------
            // GRUPO 2: ARBOLEDA Y VEGETACIÓN TRASERA
            // ------------------------------------------
            ctx.fillStyle = '#2d6a36'; // Verde follaje denso
            ctx.beginPath(); ctx.arc(150, 260, 120, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(280, 240, 140, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(1050, 310, 80, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(1150, 300, 90, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(2050, 300, 95, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(2170, 290, 110, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(2800, 280, 130, 0, Math.PI * 2); ctx.fill();

            // ------------------------------------------
            // GRUPO 3: ESTRUCTURA DE CASAS COLONIALES
            // ------------------------------------------

            // --- PAREDES BLANCAS CONTINUAS ---
            ctx.fillStyle = '#fffdfa';
            // Módulo Casona Izquierda Grande (0px a 600px)
            ctx.fillRect(0, 360, 600, 200);
            // Módulo Central Bajo (600px a 1800px)
            ctx.fillRect(600, 390, 1200, 170);
            // Módulo Casona Derecha (1800px a 3000px)
            ctx.fillRect(1800, 360, 1200, 200);

            // --- ZÓCALO ROJO TERRACOTA INFERIOR ---
            ctx.fillStyle = '#b53a2b';
            ctx.fillRect(0, 510, 3000, 50);

            // --- ZÓCALO DE PIEDRA BASE (CENTRO - IMAGEN 2) ---
            ctx.fillStyle = '#b89d82';
            ctx.fillRect(1000, 480, 500, 30);
            ctx.fillStyle = '#8f745b';
            ctx.fillRect(1000, 505, 500, 5);

            // ------------------------------------------
            // GRUPO 4: TEJADOS DE TEJA ROJA ACANALADA
            // ------------------------------------------
            ctx.fillStyle = '#bd462b';

            // Tejado Izquierdo Alto
            ctx.fillRect(-10, 335, 630, 30);
            // Tejado Central Bajo
            ctx.fillRect(590, 365, 1230, 30);
            // Tejado Derecho Alto
            ctx.fillRect(1790, 335, 1220, 30);

            // Sombra / Moldura bajo las tejas
            ctx.fillStyle = '#6e2414';
            ctx.fillRect(-10, 360, 630, 6);
            ctx.fillRect(590, 390, 1230, 6);
            ctx.fillRect(1790, 360, 1220, 6);

            // ------------------------------------------
            // GRUPO 5: PUERTAS Y VENTANAS ARCHUADAS
            // ------------------------------------------

            // --- PUERTAS ARQUEADAS DE MADERA ---
            drawArchedDoor(300, 400, 90, 160, '#66321b'); // Casona Izq
            drawArchedDoor(820, 430, 75, 130, '#592915'); // Centro 1
            drawArchedDoor(1600, 430, 80, 130, '#592915'); // Centro 2
            drawArchedDoor(2850, 400, 90, 160, '#66321b'); // Casona Der

            // --- PUERTA RECTANGULAR PRINCIPAL CON MARCO DE PIEDRA (IMAGEN 2) ---
            ctx.fillStyle = '#7a6452'; // Marco piedra
            ctx.fillRect(1200, 400, 150, 160);
            ctx.fillStyle = '#542916'; // Madera puerta
            ctx.fillRect(1212, 412, 60, 148);
            ctx.fillRect(1278, 412, 60, 148);
            ctx.fillStyle = '#f0c15d'; // Manijas doradas
            ctx.fillRect(1266, 480, 4, 12);
            ctx.fillRect(1272, 480, 4, 12);

            // --- VENTANAS CON MARCO Y CON REJAS ---
            drawWindowWithGrill(120, 410, 90, 80);  // Ventana Casona Izq
            drawWindowWithGrill(960, 440, 60, 60);  // Ventana Centro Izq
            drawWindowWithGrill(1410, 440, 60, 60); // Ventana Centro Der
            drawWindowWithGrill(2600, 410, 90, 80); // Ventana Casona Der

            // ------------------------------------------
            // GRUPO 6: FLORES DE BUGAMBILIA (FUCSIA Y MORADO)
            // ------------------------------------------

            // Enredadera Bugambilia Gigante (Izquierda)
            ctx.fillStyle = '#4a2817'; // Tronco
            ctx.fillRect(260, 350, 16, 210);
            ctx.fillStyle = '#d81b60'; // Fucsia
            ctx.beginPath(); ctx.arc(100, 270, 70, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(180, 250, 80, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(260, 280, 75, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(320, 330, 60, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(370, 390, 50, 0, Math.PI * 2); ctx.fill();

            // Flores moradas sobre ventanas y pérgolas (Centro)
            ctx.fillStyle = '#4a2817'; // Tronco
            ctx.fillRect(800, 350, 16, 210);
            ctx.fillStyle = '#9c27b0'; // Morado / Violeta
            ctx.beginPath(); ctx.arc(800, 380, 45, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(850, 360, 50, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(910, 390, 40, 0, Math.PI * 2); ctx.fill();

            // Árbol / Arbusto Bugambilia en Copa (Derecha - Imagen 2)
            ctx.fillStyle = '#4a2817'; // Tronco
            ctx.fillRect(2380, 440, 16, 120);
            ctx.fillStyle = '#d81b60'; // Copa Fucsia
            ctx.beginPath(); ctx.arc(2380, 390, 60, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(2430, 400, 50, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(2330, 410, 45, 0, Math.PI * 2); ctx.fill();

            // ------------------------------------------
            // GRUPO 7: MACETAS Y PLANTAS EN MACETA
            // ------------------------------------------
            drawMaceta(50, 520, 35, 40);
            drawMaceta(720, 520, 30, 35);
            drawMaceta(1850, 520, 30, 35);
            drawMaceta(2500, 520, 35, 40);

            // ------------------------------------------
            // GRUPO 8: SUELO Y PAVIMENTO DE PIEDRA ADOQUINADA
            // ------------------------------------------
            ctx.fillStyle = '#d6c4aa';
            ctx.fillRect(0, 560, 3000, 240); // Suelo claro base

            // Sombras proyectadas por los edificios sobre la calle
            ctx.fillStyle = 'rgba(74, 58, 43, 0.25)';
            ctx.beginPath();
            ctx.moveTo(0, 560);
            ctx.lineTo(3000, 560);
            ctx.lineTo(3000, 660);
            ctx.lineTo(0, 710);
            ctx.closePath();
            ctx.fill();

            // Bloques de adoquines de piedra trazados por zonas
            ctx.fillStyle = '#b3a087';
            // Fila 1
            ctx.fillRect(100, 600, 140, 20); ctx.fillRect(350, 600, 140, 20);
            ctx.fillRect(600, 600, 140, 20); ctx.fillRect(850, 600, 140, 20);
            ctx.fillRect(1100, 600, 140, 20); ctx.fillRect(1350, 600, 140, 20);
            ctx.fillRect(1600, 600, 140, 20); ctx.fillRect(1850, 600, 140, 20);
            ctx.fillRect(2100, 600, 140, 20); ctx.fillRect(2350, 600, 140, 20);
            ctx.fillRect(2600, 600, 140, 20); ctx.fillRect(2850, 600, 140, 20);

            // Fila 2
            ctx.fillRect(200, 660, 160, 25); ctx.fillRect(500, 660, 160, 25);
            ctx.fillRect(800, 660, 160, 25); ctx.fillRect(1100, 660, 160, 25);
            ctx.fillRect(1400, 660, 160, 25); ctx.fillRect(1700, 660, 160, 25);
            ctx.fillRect(2000, 660, 160, 25); ctx.fillRect(2300, 660, 160, 25);
            ctx.fillRect(2600, 660, 160, 25);

            // Fila 3 (Cerca del borde inferior)
            ctx.fillRect(80, 730, 200, 30); ctx.fillRect(400, 730, 200, 30);
            ctx.fillRect(720, 730, 200, 30); ctx.fillRect(1040, 730, 200, 30);
            ctx.fillRect(1360, 730, 200, 30); ctx.fillRect(1680, 730, 200, 30);
            ctx.fillRect(2000, 730, 200, 30); ctx.fillRect(2320, 730, 200, 30);
            ctx.fillRect(2640, 730, 200, 30);

            ctx.restore();
        }

        // ------------------------------------------
        // FUNCIONES AUXILIARES DE DIBUJO
        // ------------------------------------------

        // Dibujar Nubes
        function drawCloud(x, y, scale) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            ctx.arc(x, y, 35 * scale, 0, Math.PI * 2);
            ctx.arc(x + 30 * scale, y - 12 * scale, 30 * scale, 0, Math.PI * 2);
            ctx.arc(x + 60 * scale, y, 35 * scale, 0, Math.PI * 2);
            ctx.arc(x + 30 * scale, y + 12 * scale, 25 * scale, 0, Math.PI * 2);
            ctx.fill();
        }

        // Dibujar Puerta Arqueada
        function drawArchedDoor(x, y, width, height, color) {
            const radius = width / 2;
            ctx.fillStyle = '#b53a2b'; // Marco exterior rojo
            ctx.beginPath();
            ctx.arc(x + radius, y + radius - 6, radius + 6, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(x - 6, y + radius - 6, width + 12, height - radius + 6);

            ctx.fillStyle = color; // Madera interior
            ctx.beginPath();
            ctx.arc(x + radius, y + radius, radius, Math.PI, 0);
            ctx.fill();
            ctx.fillRect(x, y + radius, width, height - radius);
        }

        // Dibujar Ventana con Rejas
        function drawWindowWithGrill(x, y, w, h) {
            // Marco exterior
            ctx.fillStyle = '#b53a2b';
            ctx.fillRect(x - 5, y - 5, w + 10, h + 10);
            // Interior oscuro
            ctx.fillStyle = '#3a2016';
            ctx.fillRect(x, y, w, h);
            // Rejas de hierro
            ctx.fillStyle = '#1f130e';
            ctx.fillRect(x + w * 0.25, y, 4, h);
            ctx.fillRect(x + w * 0.50, y, 4, h);
            ctx.fillRect(x + w * 0.75, y, 4, h);
            ctx.fillRect(x, y + h * 0.5, w, 4);
        }

        // Dibujar Maceta con Planta
        function drawMaceta(x, y, w, h) {
            // Planta verde
            ctx.fillStyle = '#2e7d32';
            ctx.beginPath();
            ctx.arc(x + w / 2, y - 10, w * 0.7, 0, Math.PI * 2);
            ctx.fill();
            // Maceta de barro
            ctx.fillStyle = '#a65233';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y);
            ctx.lineTo(x + w * 0.85, y + h);
            ctx.lineTo(x + w * 0.15, y + h);
            ctx.closePath();
            ctx.fill();
        }

        // ------------------------------------------
        // CONTROLES DE DESLIZAMIENTO (TOUCH / MOUSE)
        // ------------------------------------------
        function onPointerDown(x) {
            isDragging = true;
            startX = x;
            startCameraX = cameraX;
        }

        function onPointerMove(x) {
            if (!isDragging) return;
            const dx = (startX - x) / (canvas.height / WORLD_HEIGHT);
            cameraX = startCameraX + dx;
            clampCamera();
            render();
        }

        function onPointerUp() {
            isDragging = false;
        }

        // Eventos de Mouse
        container.addEventListener('mousedown', (e) => onPointerDown(e.clientX));
        window.addEventListener('mousemove', (e) => onPointerMove(e.clientX));
        window.addEventListener('mouseup', onPointerUp);

        // Eventos Táctiles (Celulares / Tablets)
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) onPointerDown(e.touches[0].clientX);
        });
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) onPointerMove(e.touches[0].clientX);
        });
        window.addEventListener('touchend', onPointerUp);

        window.addEventListener('resize', resize);
        resize();
    </script>

</body>

</html>
