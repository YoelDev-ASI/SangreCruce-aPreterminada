<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Botón Configuración</title>
<style>
body{
    margin:0;
    background:#2f6d1d;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    background:#2f6d1d;
}
</style>
</head>
<body>

<canvas id="canvas" width="200" height="200"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");


// ========================
// BOTÓN VERDE
// ========================

ctx.beginPath();
ctx.arc(100,100,70,0,2*Math.PI);
ctx.fillStyle="#1b5e20";
ctx.fill();

ctx.beginPath();
ctx.arc(100,100,60,0,2*Math.PI);
ctx.fillStyle="#2e7d32";
ctx.fill();


// ========================
// ENGRANAJE
// ========================

ctx.fillStyle="#f4c430";

// Arriba
ctx.beginPath();
ctx.rect(95,48,10,18);
ctx.fill();

// Abajo
ctx.beginPath();
ctx.rect(95,134,10,18);
ctx.fill();

// Izquierda
ctx.beginPath();
ctx.rect(48,95,18,10);
ctx.fill();

// Derecha
ctx.beginPath();
ctx.rect(134,95,18,10);
ctx.fill();

// Superior izquierda
ctx.beginPath();
ctx.rect(65,65,12,12);
ctx.fill();

// Superior derecha
ctx.beginPath();
ctx.rect(123,65,12,12);
ctx.fill();

// Inferior izquierda
ctx.beginPath();
ctx.rect(65,123,12,12);
ctx.fill();

// Inferior derecha
ctx.beginPath();
ctx.rect(123,123,12,12);
ctx.fill();


// Centro del engranaje
ctx.beginPath();
ctx.arc(100,100,30,0,2*Math.PI);
ctx.fillStyle="#f4c430";
ctx.fill();

// Agujero
ctx.beginPath();
ctx.arc(100,100,10,0,2*Math.PI);
ctx.fillStyle="#2e7d32";
ctx.fill();

</script>

</body>
</html>
