<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Machete Canvas-JS</title>

<style>
body{
    margin:0;
    background:#dcdcdc;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    background:white;
    border:1px solid #444;
}
</style>

</head>
<body>

<canvas id="canvas" width="900" height="650"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "black";


//====================================
// HOJA DEL MACHETE
//====================================

ctx.beginPath();

ctx.moveTo(170,90);

ctx.bezierCurveTo(
    115,175,
    145,245,
    260,305
);

ctx.bezierCurveTo(
    420,390,
    560,550,
    620,560
);

ctx.bezierCurveTo(
    595,525,
    520,430,
    385,315
);

ctx.bezierCurveTo(
    285,225,
    240,155,
    200,120
);

ctx.closePath();
ctx.fill();


//====================================
// MANGO
//====================================

ctx.beginPath();

ctx.moveTo(540,495);

ctx.quadraticCurveTo(
    570,470,
    610,500
);

ctx.lineTo(655,570);

ctx.quadraticCurveTo(
    630,597,
    595,583
);

ctx.lineTo(532,520);

ctx.quadraticCurveTo(
    518,508,
    540,495
);

ctx.closePath();
ctx.fill();

</script>

</body>
</html>
