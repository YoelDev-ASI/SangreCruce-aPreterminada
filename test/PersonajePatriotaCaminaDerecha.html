<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personaje Animado - Caminata de Perfil Derecho</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1e1e24;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        canvas {
            background-color: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
        }

        .controls {
            margin-top: 18px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #1b5e20;
            color: white;
            transition: 0.2s ease;
        }

        button:hover {
            background-color: #2e7d32;
        }
    </style>
</head>

<body>

    <h2>Personaje Animado - Caminando hacia la Derecha ➡️</h2>
    <canvas id="canvasPersonaje" width="600" height="600"></canvas>

    <div class="controls">
        <button onclick="setEstado('idle')">Reposo (Idle)</button>
        <button onclick="setEstado('caminar')">Caminar a la Derecha</button>
    </div>

    <script>
        const canvas = document.getElementById('canvasPersonaje');
        const ctx = canvas.getContext('2d');

        const colorVerde = '#1b5e20';

        let estadoAnimacion = 'caminar';
        let tiempo = 0;

        function setEstado(nuevoEstado) {
            estadoAnimacion = nuevoEstado;
        }

        /**
         * Dibuja miembros con articulaciones adaptadas para vista lateral (Perfil Derecho)
         */
        function dibujarMiembroArticulado(x, y, anguloHombroCadera, largo1, anguloCodoRodilla, largo2, grosor, color, esPie) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(anguloHombroCadera);

            // 1. Tramo Superior (Muslo o Brazo)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, largo1);
            ctx.strokeStyle = color;
            ctx.lineWidth = grosor;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Ir a la articulación (Codo o Rodilla)
            ctx.translate(0, largo1);
            ctx.rotate(anguloCodoRodilla);

            // 2. Tramo Inferior (Antebrazo o Pantorrilla)
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, largo2);
            ctx.stroke();

            // 3. Extremo (Mano o Pie hacia la Derecha)
            ctx.translate(0, largo2);
            if (esPie) {
                // Pie orientado hacia la derecha
                ctx.beginPath();
                ctx.ellipse(8, 0, grosor / 1.2, grosor / 1.8, 0, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            } else {
                // Mano esférica
                ctx.beginPath();
                ctx.arc(0, 0, grosor / 1.6, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
            }

            ctx.restore();
        }

        // BUCLE PRINCIPAL DE ANIMACIÓN
        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Velocidad constante para la caminata/idle
            tiempo += 0.06;

            const posX = 300;
            let posY = 220;

            let anguloHombroIzq = 0, anguloCodoIzq = 0;
            let anguloHombroDer = 0, anguloCodoDer = 0;
            let anguloCaderaIzq = 0, anguloRodillaIzq = 0;
            let anguloCaderaDer = 0, anguloRodillaDer = 0;

            // --- ESTADOS DE MOVIMIENTO ---
            if (estadoAnimacion === 'caminar') {
                const ciclo = Math.sin(tiempo * 1.5);

                // Rebote vertical sutil de caminata
                posY += Math.abs(Math.sin(tiempo * 3)) * 8;

                // PIERNAS (Oscilación de adelante a atrás)
                anguloCaderaIzq = ciclo * 0.7;                          // Leg 1
                anguloRodillaIzq = (ciclo < 0) ? -ciclo * 0.8 : 0.1;   // Doblar rodilla al recoger

                anguloCaderaDer = -ciclo * 0.7;                         // Leg 2
                anguloRodillaDer = (ciclo > 0) ? ciclo * 0.8 : 0.1;

                // BRAZOS (Braceo cruzado hacia la derecha/izquierda)
                anguloHombroIzq = -ciclo * 0.6;                        // Arm 1
                anguloCodoIzq = -0.8 + Math.sin(tiempo * 1) * 0.6;      // Codo flexionado hacia la derecha

                anguloHombroDer = ciclo * 0.6;                         // Arm 2
                anguloCodoDer = -0.8 - Math.sin(tiempo * 1) * 0.6;

            } else if (estadoAnimacion === 'idle') {
                posY += Math.sin(tiempo * 2) * 2; // Respiración

                anguloHombroIzq = 0.1; anguloCodoIzq = 0.2;
                anguloHombroDer = -0.1; anguloCodoDer = 0.2;
                anguloCaderaIzq = 0.1; anguloRodillaIzq = 0.05;
                anguloCaderaDer = -0.1; anguloRodillaDer = 0.05;
            }

            const largoBrazo1 = 50, largoBrazo2 = 45;
            const largoPierna1 = 60, largoPierna2 = 55;
            const grosorExtremidad = 22;

            // ------------------------------------------
            // 1. EXTREMIDADES TRASERAS (LADO IZQUIERDO)
            // ------------------------------------------
            dibujarMiembroArticulado(
                posX + 5, posY + 50,
                anguloHombroIzq, largoBrazo1,
                anguloCodoIzq, largoBrazo2,
                grosorExtremidad - 2, colorVerde, false
            );

            dibujarMiembroArticulado(
                posX - 5, posY + 150,
                anguloCaderaIzq, largoPierna1,
                anguloRodillaIzq, largoPierna2,
                grosorExtremidad, colorVerde, true
            );

            // ------------------------------------------
            // 2. TORSO LEVEMENTE INCLINADO A LA DERECHA
            // ------------------------------------------
            ctx.save();
            ctx.translate(posX, posY + 30);
            ctx.rotate(0.08); // Inclinación hacia adelante
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(12, 20);
            ctx.lineTo(8, 120);
            ctx.lineTo(-12, 120);
            ctx.lineTo(-14, 20);
            ctx.closePath();
            ctx.fillStyle = colorVerde;
            ctx.fill();
            ctx.restore();

            // ------------------------------------------
            // 3. CABEZA
            // ------------------------------------------
            ctx.beginPath();
            ctx.arc(posX + 4, posY - 5, 38, 0, Math.PI * 2);
            ctx.fillStyle = colorVerde;
            ctx.fill();

            // ------------------------------------------
            // 4. EXTREMIDADES DELANTERAS (LADO DERECHO)
            // ------------------------------------------
            dibujarMiembroArticulado(
                posX - 5, posY + 150,
                anguloCaderaDer, largoPierna1,
                anguloRodillaDer, largoPierna2,
                grosorExtremidad + 2, colorVerde, true
            );

            dibujarMiembroArticulado(
                posX + 5, posY + 50,
                anguloHombroDer, largoBrazo1,
                anguloCodoDer, largoBrazo2,
                grosorExtremidad, colorVerde, false
            );

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>

</html>
