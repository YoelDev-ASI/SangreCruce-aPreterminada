<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Espadas Cruzadas - HTML5 Canvas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <canvas id="miCanvas" width="1200" height="1200"></canvas>

    <script>
        const canvas = document.getElementById('miCanvas');
        const ctx = canvas.getContext('2d');

        // Trazado con coordenadas explícitas de la figura de la espada
        function dibujarEspada(ctx) {
            ctx.beginPath();

            // Punta de la hoja
            ctx.moveTo(0, -220);
            ctx.lineTo(32, -180);

            // Borde derecho de la hoja
            ctx.lineTo(32, 50);

            // Guarda derecha (curvatura de la empuñadura)
            ctx.quadraticCurveTo(65, 45, 80, 20);
            ctx.quadraticCurveTo(65, 75, 30, 80);

            // Mango derecho
            ctx.quadraticCurveTo(20, 110, 30, 150);

            // Pomo inferior (base hexagonal/redonda)
            ctx.lineTo(42, 160);
            ctx.lineTo(35, 185);
            ctx.lineTo(0, 195);
            ctx.lineTo(-35, 185);
            ctx.lineTo(-42, 160);

            // Mango izquierdo
            ctx.lineTo(-30, 150);
            ctx.quadraticCurveTo(-20, 110, -30, 80);

            // Guarda izquierda
            ctx.quadraticCurveTo(-65, 75, -80, 20);
            ctx.quadraticCurveTo(-65, 45, -32, 50);

            // Borde izquierdo de la hoja
            ctx.lineTo(-32, -180);

            ctx.closePath();
            ctx.fillStyle = '#000000';
            ctx.fill();
        }

        // --- Espada 1 (Diagonal de abajo-izquierda a arriba-derecha: 45°) ---
        ctx.save();
        ctx.translate(300, 300);
        ctx.rotate(45 * Math.PI / 180);
        dibujarEspada(ctx);
        ctx.restore();

        // --- Espada 2 (Diagonal de abajo-derecha a arriba-izquierda: -45°) ---
        ctx.save();
        ctx.translate(300, 300);
        ctx.rotate(-45 * Math.PI / 180);
        dibujarEspada(ctx);
        ctx.restore();
    </script>

</body>

</html>
