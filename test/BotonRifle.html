<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fusil Canvas-JS</title>

<style>
body{
    margin:0;
    background:#d8d8d8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    background:white;
    border:1px solid #444;
}
</style>

</head>
<body>

<canvas id="canvas" width="600" height="650"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

ctx.fillStyle = "black";

ctx.translate(170,520);
ctx.rotate(-40*Math.PI/180);



//====================================
// CULATA
//====================================

ctx.beginPath();

ctx.moveTo(-80,50);
ctx.lineTo(-80,-35);
ctx.lineTo(50,-18);
ctx.lineTo(50,25);
ctx.lineTo(-5,30);
ctx.lineTo(-45,45);

ctx.closePath();
ctx.fill();




//====================================
// EMPUÑADURA
//====================================

ctx.beginPath();

ctx.moveTo(0,-5);
ctx.lineTo(45,-5);
ctx.lineTo(55,18);
ctx.lineTo(35,48);
ctx.lineTo(10,46);
ctx.lineTo(15,10);

ctx.closePath();
ctx.fill();




//====================================
// GUARDAMONTE
//====================================

ctx.beginPath();

ctx.moveTo(40,5);
ctx.lineTo(72,5);
ctx.lineTo(100,10);
ctx.lineTo(67,48);
ctx.lineTo(35,48);
ctx.lineTo(42,35);
ctx.lineTo(65,35);
ctx.lineTo(78,20);
ctx.lineTo(62,12);
ctx.lineTo(40,12);

ctx.closePath();
ctx.fill();




//====================================
// CAJA DEL MECANISMO
//====================================

ctx.beginPath();

ctx.moveTo(45,-18);
ctx.lineTo(95,-18);
ctx.lineTo(108,-2);
ctx.lineTo(86,18);
ctx.lineTo(40,18);

ctx.closePath();
ctx.fill();

//====================================
// CAÑÓN
//====================================

ctx.beginPath();

ctx.rect(92,-12,330,24);

ctx.fill();


//====================================
// PEQUEÑO ESCALÓN
//====================================

ctx.beginPath();

ctx.moveTo(110,-12);
ctx.lineTo(125,-24);
ctx.lineTo(145,-24);
ctx.lineTo(145,-12);

ctx.closePath();
ctx.fill();

</script>

</body>
</html>
