<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Icono de Grupo de Personas - HTML5 Canvas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <canvas id="miCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('miCanvas');
        const ctx = canvas.getContext('2d');

        // Fondo blanco del lienzo
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#000000';

        // ==========================================
        // 1. PERSONA IZQUIERDA (SEGUNDO PLANO)
        // ==========================================
        // Cabeza izquierda
        ctx.beginPath();
        ctx.arc(175, 215, 23, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo / Hombros izquierda
        ctx.beginPath();
        ctx.moveTo(150, 310);
        ctx.lineTo(150, 265);
        ctx.quadraticCurveTo(150, 245, 175, 245);
        ctx.quadraticCurveTo(200, 245, 200, 265);
        ctx.lineTo(200, 310);
        ctx.quadraticCurveTo(175, 313, 150, 310);
        ctx.fill();


        // ==========================================
        // 2. PERSONA DERECHA (SEGUNDO PLANO)
        // ==========================================
        // Cabeza derecha
        ctx.beginPath();
        ctx.arc(325, 215, 23, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo / Hombros derecha
        ctx.beginPath();
        ctx.moveTo(300, 310);
        ctx.lineTo(300, 265);
        ctx.quadraticCurveTo(300, 245, 325, 245);
        ctx.quadraticCurveTo(350, 245, 350, 265);
        ctx.lineTo(350, 310);
        ctx.quadraticCurveTo(325, 313, 300, 310);
        ctx.fill();


        // ==========================================
        // 3. RECORTES / SEPARACIÓN BLANCA ALREDEDOR
        // ==========================================
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(190, 326);
        ctx.lineTo(190, 268);
        ctx.quadraticCurveTo(190, 236, 250, 236);
        ctx.quadraticCurveTo(310, 236, 310, 268);
        ctx.lineTo(310, 326);
        ctx.quadraticCurveTo(250, 332, 190, 326);
        ctx.fill();


        // ==========================================
        // 4. PERSONA CENTRAL (PRIMER PLANO)
        // ==========================================
        ctx.fillStyle = '#000000';

        // Cabeza central (más grande)
        ctx.beginPath();
        ctx.arc(250, 205, 35, 0, Math.PI * 2);
        ctx.fill();

        // Cuerpo / Hombros central (más grande)
        ctx.beginPath();
        ctx.moveTo(196, 320);
        ctx.lineTo(196, 272);
        ctx.quadraticCurveTo(196, 244, 250, 244);
        ctx.quadraticCurveTo(304, 244, 304, 272);
        ctx.lineTo(304, 320);
        ctx.quadraticCurveTo(250, 326, 196, 320);
        ctx.fill();

    </script>

</body>

</html>
