<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Escudo - HTML5 Canvas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e0e0e0;
        }

        canvas {
            background-color: #e0e0e0;
        }
    </style>
</head>

<body>

    <canvas id="miCanvas" width="500" height="500"></canvas>

    <script>
        const canvas = document.getElementById('miCanvas');
        const ctx = canvas.getContext('2d');

        const colorEscudo = '#2d2d2d';
        const colorFondo = '#e0e0e0';

        // --- 1. ESCUDO EXTERIOR ---
        ctx.beginPath();
        ctx.moveTo(150, 120);                      // Esquina superior izquierda
        ctx.quadraticCurveTo(250, 105, 350, 120);  // Arco superior hacia esquina superior derecha
        ctx.lineTo(350, 260);                       // Lateral derecho recto
        ctx.quadraticCurveTo(350, 360, 250, 410);  // Curva inferior derecha hacia la punta
        ctx.quadraticCurveTo(150, 360, 150, 260);  // Curva inferior izquierda desde la punta
        ctx.closePath();                            // Lateral izquierdo recto
        ctx.fillStyle = colorEscudo;
        ctx.fill();

        // --- 2. MARGEN INTERMEDIO (COLOR DE FONDO) ---
        ctx.beginPath();
        ctx.moveTo(162, 133);
        ctx.quadraticCurveTo(250, 119, 338, 133);
        ctx.lineTo(338, 258);
        ctx.quadraticCurveTo(338, 348, 250, 393);
        ctx.quadraticCurveTo(162, 348, 162, 258);
        ctx.closePath();
        ctx.fillStyle = colorFondo;
        ctx.fill();

        // --- 3. ESCUDO INTERIOR ---
        ctx.beginPath();
        ctx.moveTo(172, 143);
        ctx.quadraticCurveTo(250, 130, 328, 143);
        ctx.lineTo(328, 256);
        ctx.quadraticCurveTo(328, 338, 250, 379);
        ctx.quadraticCurveTo(172, 338, 172, 256);
        ctx.closePath();
        ctx.fillStyle = colorEscudo;
        ctx.fill();

    </script>

</body>

</html>
