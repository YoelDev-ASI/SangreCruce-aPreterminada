<!DOCTYPE html>
<html>
<body>
<h1>HTML5 Canvas bezierCurveTo() Method</h1>

<canvas id="myCanvas" width="1280" height="720" style="border:1px solid #000000;">
Sorry, your browser does not support canvas.
</canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

function dibujarNube()
{
    ctx.beginPath();
    ctx.moveTo(180, 0);
    ctx.bezierCurveTo(80, 150, 220, 30, 110, 200);

    // Primera curva
    ctx.bezierCurveTo(300, 200, 220, 240, 200, 320);

    // Segunda curva
    ctx.bezierCurveTo(400, 350, 0, 600, 200, 550);

    // Tercera curva
    ctx.bezierCurveTo(350, 520, 50, 950, 100, 720);
    ctx.stroke();
}

function MapaSantaCruz()
{
    dibujarNube()
}

MapaSantaCruz()
</script>

</body>
</html>
